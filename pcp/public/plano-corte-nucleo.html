<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Plano de Corte (Núcleo) — PCP Persianas Paraná</title>
<link rel="icon" type="image/png" href="assets/brand/logos/favicon.png">
<link rel="stylesheet" href="assets/fonts/manrope.css">
<style>
:root { --black:#1D1D1B; --red:#C1212D; --gold:#C6B784; --border:#D9D9D9; --text2:#555; --text3:#888; --bg:#F4F4F2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Manrope', Arial, sans-serif; font-size: 12px; color: var(--black); background: var(--bg); }
#pagina { max-width: 900px; margin: 0 auto; padding: 24px; background: #fff; min-height: 100vh; }

.no-print { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
.no-print .btn { padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: #fff; font-family: inherit; }
.no-print .btn-red { background: var(--red); color: #fff; border-color: var(--red); }
.no-print .aviso { font-size: 11px; color: var(--text3); margin-left: auto; }

h1 { font-size: 18px; letter-spacing: .02em; margin-bottom: 4px; }
h2 { font-size: 14px; background: #eee; padding: 6px 10px; margin: 16px 0 4px; border-radius: 4px;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }

table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #bbb; padding: 4px 8px; font-size: 12px; }
th { background: #f5f5f5; text-align: left; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
td.n, th.n { text-align: right; }

.peca-head { font-size: 12.5px; margin-top: 8px; }
.peca-head .cod { font-family: monospace; font-size: 10px; color: var(--text3); }
.sem-plano { color: #a00; font-size: 12px; }
.alerta { background: #FFF6E5; border: 1px solid #E9B44C; border-radius: 6px; padding: 8px 12px; font-size: 11px; margin: 10px 0; }
select.variante { font-size: 11px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; max-width: 320px; }

@media print {
  body { background: #fff; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #pagina { max-width: none; padding: 0; }
  .no-print { display: none !important; }
  @page { size: A4; margin: 12mm; }
}
</style>
</head>
<body>
<div id="pagina">
  <div class="no-print" id="acoes">
    <button class="btn btn-red" onclick="window.__imprimirPlano ? window.__imprimirPlano() : window.print()">🖨 Imprimir e registrar</button>
    <button class="btn" onclick="window.close()">Fechar</button>
    <span class="aviso">Imprimir registra o “já impresso” do pedido. Só o documento sai no papel — os seletores de variante são de tela.</span>
  </div>
  <div id="conteudo">
    <div style="padding:40px;text-align:center;color:#888;font-size:13px">Carregando o plano de corte…</div>
  </div>
</div>
<script src="assets/js/plano-corte-nucleo.js" defer></script>
</body>
</html>
