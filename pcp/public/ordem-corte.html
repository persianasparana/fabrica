<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ordem de Corte — PCP Persianas Paraná</title>
<link rel="icon" type="image/png" href="assets/brand/logos/favicon.png">
<link rel="stylesheet" href="assets/fonts/manrope.css">
<style>
:root { --black:#1D1D1B; --red:#C1212D; --gold:#C6B784; --border:#D9D9D9; --text2:#555; --text3:#888; --bg:#F4F4F2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Manrope', Arial, sans-serif; font-size: 12px; color: var(--black); background: var(--bg); }
#pagina { max-width: 900px; margin: 0 auto; padding: 24px; background: #fff; min-height: 100vh; }

/* Barra de ações (não sai na impressão) */
#acoes { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
#acoes .btn {
  padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700;
  cursor: pointer; border: 1px solid var(--border); background: #fff; font-family: inherit;
}
#acoes .btn-red { background: var(--red); color: #fff; border-color: var(--red); }
#acoes .aviso { font-size: 11px; color: var(--text3); margin-left: auto; }
#acoes .ctrl { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); font-weight: 700; }
#acoes .ctrl input, #acoes .ctrl select {
  font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 8px;
  border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--black);
}
#acoes .ctrl input { width: 62px; text-align: right; }

/* Cabeçalho do documento */
.doc-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--black); padding-bottom: 12px; margin-bottom: 14px; }
.doc-header img { height: 34px; width: auto; }
.doc-header .titulo { text-align: right; }
.doc-header h1 { font-size: 19px; letter-spacing: .02em; }
.doc-header .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.meta { display: flex; gap: 22px; flex-wrap: wrap; font-size: 11px; margin-bottom: 16px; }
.meta b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text3); }
.meta span { font-size: 13px; font-weight: 700; }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 2px solid var(--black); padding-bottom: 4px; margin: 18px 0 8px; }
h3 { font-size: 12px; margin: 12px 0 6px; }

table { width: 100%; border-collapse: collapse; font-size: 11px; }
th { background: var(--black); color: #fff; text-align: left; padding: 5px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
td { border-bottom: 1px solid var(--border); padding: 4px 8px; vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }
.destaque { font-weight: 800; }
.badge-barras { display: inline-block; background: var(--black); color: var(--gold); border-radius: 999px; padding: 1px 9px; font-weight: 800; font-size: 11px; }

/* Plano de barras */
.barra-linha { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px dashed var(--border); padding: 3px 0; font-size: 11px; }
.barra-num { min-width: 64px; font-weight: 800; }
.barra-cortes { flex: 1; font-family: 'Courier New', monospace; letter-spacing: .02em; }
.barra-sobra { min-width: 110px; text-align: right; color: var(--text2); }
.aproveitamento { font-size: 11px; color: var(--text2); margin: 4px 0 2px; }

/* Plano em desenho — barras proporcionais */
.barra-viz { margin: 7px 0 11px; }
.barra-viz__cab { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; color: var(--text2); margin-bottom: 3px; }
.barra-viz__tag { display: inline-block; background: var(--black); color: var(--gold); border-radius: 999px; padding: 1px 9px; font-weight: 800; font-size: 10px; }
.barra-viz__track {
  display: flex; height: 34px; border: 1px solid var(--black); border-radius: 4px;
  overflow: hidden; background: #fff;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.barra-viz__track .seg {
  display: flex; align-items: center; justify-content: center; min-width: 0;
  font-size: 9px; font-weight: 800; color: #fff; overflow: hidden;
  border-right: 1px solid rgba(255,255,255,.65);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.barra-viz__track .seg span { padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-viz__track .seg:nth-child(odd)  { background: var(--black); }
.barra-viz__track .seg:nth-child(even) { background: #8a6d24; }   /* dourado escuro p/ texto branco */
.barra-viz__sobra {
  display: flex; align-items: center; justify-content: center; min-width: 0;
  font-size: 9px; font-weight: 700; color: var(--text2); overflow: hidden;
  background: repeating-linear-gradient(45deg,#efeee9,#efeee9 4px,#e2e0d8 4px,#e2e0d8 8px);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}

/* Alternância entre desenho e texto (data-modo no <body>, definido pelo JS) */
body[data-modo="desenho"] .plano-texto { display: none; }
body[data-modo="texto"]   .plano-desenho { display: none; }

.alerta { background: #FFF6E5; border: 1px solid #E9B44C; border-radius: 6px; padding: 8px 12px; font-size: 11px; margin: 10px 0; }
.rodape { margin-top: 26px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 10px; color: var(--text3); display: flex; justify-content: space-between; }
.quebra { page-break-inside: avoid; }

@media print {
  body { background: #fff; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #pagina { max-width: none; padding: 0; }
  #acoes { display: none !important; }
  h2 { page-break-after: avoid; }
  .quebra { page-break-inside: avoid; }
  @page { size: A4; margin: 14mm 12mm; }
}
</style>
</head>
<body>
<div id="pagina">
  <div id="acoes">
    <button class="btn btn-red" onclick="window.print()">🖨 Imprimir</button>
    <button class="btn" id="exportar" title="Exportar resumo de compra e cortes (CSV/Excel)">⬇ Exportar CSV</button>
    <label class="ctrl">Barra (m)
      <input type="text" id="barra" inputmode="decimal" title="Comprimento da barra em metros — recalcula o plano ao vivo">
    </label>
    <label class="ctrl">Plano
      <select id="modo" title="Como mostrar o plano das barras">
        <option value="desenho">Desenho</option>
        <option value="texto">Texto</option>
        <option value="ambos">Ambos</option>
      </select>
    </label>
    <button class="btn" onclick="window.close()">Fechar</button>
    <span class="aviso">Só o documento sai na impressão.</span>
  </div>
  <div id="conteudo">
    <div style="padding:40px;text-align:center;color:#888;font-size:13px">Carregando a ordem de corte…</div>
  </div>
</div>
<script src="assets/js/ordem-corte-calc.js" defer></script>
<script src="assets/js/ordem-corte.js" defer></script>
</body>
</html>
