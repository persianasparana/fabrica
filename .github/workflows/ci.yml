name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pcp-frontend:
    name: PCP frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pcp/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  server:
    name: Backend (Node + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fabrica
          POSTGRES_PASSWORD: fabrica
          POSTGRES_DB: fabrica
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fabrica"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: fabrica
      PGPASSWORD: fabrica
      PGDATABASE: fabrica
      SESSION_SECRET: ci-secret
      PORT: 8090
      SERVE_STATIC: '0'
      FABRICA_ADMIN_USER: ci
      FABRICA_ADMIN_PASSWORD: senha12345
      FABRICA_ADMIN_NAME: CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run install-app
      - name: Smoke test (auth + PCP + Qualidade)
        run: |
          node src/server.js &
          sleep 3
          B=http://127.0.0.1:8090; J=/tmp/j.txt
          L=$(curl -s -c $J -b $J -X POST -H 'Content-Type: application/json' -d '{"username":"ci","password":"senha12345"}' $B/api/auth/login)
          echo "$L"
          CSRF=$(echo "$L" | node -e 'process.stdin.on("data",d=>{try{console.log(JSON.parse(d).csrf_token||"")}catch{}})')
          test -n "$CSRF" || { echo "login falhou"; exit 1; }
          curl -s -c $J -b $J -X PUT -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"value":"{\"id\":1}"}' "$B/api/pcp/storage?key=pedido:1" | grep -q '"ok":true' || { echo "pcp set falhou"; exit 1; }
          curl -s -c $J -b $J "$B/api/pcp/storage?prefix=pedido:" | grep -q 'pedido:1' || { echo "pcp list falhou"; exit 1; }
          curl -s -c $J -b $J -X POST -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"data_ocorrencia":"2026-06-09","descricao":"ci"}' "$B/api/qualidade/ncs" | grep -q '"id"' || { echo "qualidade create falhou"; exit 1; }
          echo "Smoke test OK"
