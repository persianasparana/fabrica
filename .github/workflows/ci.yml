name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontends:
    name: Frontends (sintaxe JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check em todos os JS dos frontends
        run: |
          set -e
          for f in pcp/public/assets/js/*.js qualidade/public/assets/js/*.js; do
            node --check "$f" && echo "OK $f"
          done

  server:
    name: Backend (Node + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fabrica
          POSTGRES_PASSWORD: fabrica
          POSTGRES_DB: fabrica
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fabrica"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: fabrica
      PGPASSWORD: fabrica
      PGDATABASE: fabrica
      SESSION_SECRET: ci-secret
      PORT: 8090
      SERVE_STATIC: '0'
      FABRICA_ADMIN_USER: ci
      FABRICA_ADMIN_PASSWORD: senha12345
      FABRICA_ADMIN_NAME: CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run install-app
      - name: Smoke test (auth + PCP itens/estrutura/bip + Qualidade)
        run: |
          node src/server.js &
          sleep 3
          B=http://127.0.0.1:8090; J=/tmp/j.txt
          L=$(curl -s -c $J -b $J -X POST -H 'Content-Type: application/json' -d '{"username":"ci","password":"senha12345"}' $B/api/auth/login)
          CSRF=$(echo "$L" | node -e 'process.stdin.on("data",d=>{try{console.log(JSON.parse(d).csrf_token||"")}catch{}})')
          test -n "$CSRF" || { echo "login falhou: $L"; exit 1; }

          # Estrutura do produto carregada pelo seed (34 produtos)
          N=$(curl -s -c $J -b $J $B/api/pcp/estrutura | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).data.length))')
          test "$N" = "34" || { echo "estrutura: esperado 34, veio $N"; exit 1; }

          # Fila seeded (186 itens)
          N=$(curl -s -c $J -b $J $B/api/pcp/itens | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).data.length))')
          test "$N" = "186" || { echo "itens: esperado 186, veio $N"; exit 1; }

          # Criar item especial com 2 peças + bipagem por peça
          # (vincular etiqueta -> baixa da 1ª peça -> item segue aberto -> baixa da 2ª -> item concluído)
          R=$(curl -s -c $J -b $J -X POST -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"produto":"ROLO SOFT LISA","pedido":"99001","qnt":2,"data_cliente":"2026-12-01","especial":true}' \
            $B/api/pcp/itens)
          echo "$R" | grep -q '"especial":true' || { echo "criar item especial falhou: $R"; exit 1; }
          N=$(echo "$R" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).item.pecas.length))')
          test "$N" = "2" || { echo "esperava 2 peças, veio $N"; exit 1; }
          curl -s -c $J -b $J -X POST -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"codigo":"CI-ETQ-1","pedido":"99001"}' $B/api/pcp/bip/vincular | grep -q '"acao":"vinculada"' || { echo "vincular 1 falhou"; exit 1; }
          curl -s -c $J -b $J -X POST -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"codigo":"CI-ETQ-2","pedido":"99001"}' $B/api/pcp/bip/vincular | grep -q '"acao":"vinculada"' || { echo "vincular 2 falhou"; exit 1; }
          R=$(curl -s -c $J -b $J -X POST -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"codigo":"CI-ETQ-1"}' $B/api/pcp/bip)
          echo "$R" | grep -q '"acao":"baixa"' || { echo "baixa 1 falhou: $R"; exit 1; }
          echo "$R" | grep -q '"conclusao":null' || { echo "item não deveria estar concluído (1/2): $R"; exit 1; }
          R=$(curl -s -c $J -b $J -X POST -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"codigo":"CI-ETQ-2"}' $B/api/pcp/bip)
          echo "$R" | grep -q '"acao":"baixa"' || { echo "baixa 2 falhou"; exit 1; }
          echo "$R" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.exit(j.item.conclusao ? 0 : 1)})' || { echo "item deveria estar concluído (2/2)"; exit 1; }
          curl -s -c $J -b $J -X POST -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"codigo":"CI-ETQ-1"}' $B/api/pcp/bip | grep -q '"acao":"jafoi"' || { echo "jafoi falhou"; exit 1; }

          # Qualidade segue funcionando
          curl -s -c $J -b $J -X POST -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"data_ocorrencia":"2026-06-09","descricao":"ci"}' $B/api/qualidade/ncs | grep -q '"id"' || { echo "qualidade falhou"; exit 1; }
          echo "Smoke test OK"
