name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pcp-frontend:
    name: PCP frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pcp/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  php-backends:
    name: Backends PHP (lint + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, json

      - name: Lint PHP (php -l)
        run: |
          find pcp/api qualidade -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Smoke test do backend do PCP
        run: |
          cd pcp/api
          cat > config/config.php <<'PHP'
          <?php
          return [
            'app' => ['name'=>'ci','version'=>'1.0.0','environment'=>'development','timezone'=>'America/Sao_Paulo','debug'=>true],
            'database' => ['driver'=>'sqlite','sqlite'=>['path'=>'/tmp/ci_pcp.db'],'mysql'=>[]],
            'security' => ['secret_key'=>'ci','session_lifetime'=>28800,'session_secure_cookie'=>false,'max_login_attempts'=>5,'lockout_duration'=>900],
          ];
          PHP
          php -r 'require "src/Database.php"; require "src/Auth.php"; $c=require "config/config.php"; $db=Database::getInstance($c["database"]); (new Auth($db,$c["security"]))->createUser("ci","senha12345","CI","admin"); echo "user ok\n";'
          php -S 127.0.0.1:8090 -t public &
          sleep 2
          JAR=/tmp/jar.txt
          LOGIN=$(curl -s -c $JAR -b $JAR -X POST -H 'Content-Type: application/json' -d '{"username":"ci","password":"senha12345"}' http://127.0.0.1:8090/api/auth.php)
          echo "$LOGIN"
          CSRF=$(echo "$LOGIN" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["csrf_token"]??"";')
          test -n "$CSRF" || { echo "login falhou"; exit 1; }
          curl -s -c $JAR -b $JAR -X PUT -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"value":"{\"id\":1}"}' "http://127.0.0.1:8090/api/storage.php?key=pedido:1" | grep -q '"ok":true' || { echo "set falhou"; exit 1; }
          curl -s -c $JAR -b $JAR "http://127.0.0.1:8090/api/storage.php?prefix=pedido:" | grep -q 'pedido:1' || { echo "list falhou"; exit 1; }
          echo "Smoke test OK"
