<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Login — Sistema de Qualidade Persianas Paraná</title>
<link rel="icon" type="image/png" href="assets/brand/logos/favicon.png">
<link rel="apple-touch-icon" href="assets/brand/logos/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-bg">
<main class="login-wrap">
  <form class="login-card" id="login-form" autocomplete="off">
    <img class="login-logo" src="assets/brand/logos/logo-preto.png" alt="Persianas Paraná">
    <h1 class="login-title">Sistema de Qualidade</h1>
    <p class="login-sub">Gestão de Não Conformidades</p>

    <div class="field">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>

    <div id="login-error" class="login-error" role="alert" hidden></div>

    <button type="submit" class="btn-primary" id="btn-login">Entrar</button>

    <p class="login-foot">v1.0.0 · © Persianas Paraná</p>
  </form>
</main>

<script src="assets/js/login.js"></script>
</body>
</html>
