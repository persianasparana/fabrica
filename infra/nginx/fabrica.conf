# Nginx — fabrica (PCP + Qualidade)
#
# Encaminha um subdomínio próprio para o serviço Node (127.0.0.1:8080),
# que serve os dois frontends (/pcp, /qualidade) e as APIs (/api/*).
#
# Instalação:
#   sudo cp infra/nginx/fabrica.conf /etc/nginx/sites-available/fabrica.conf
#   sudo ln -s /etc/nginx/sites-available/fabrica.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # HTTPS: sudo certbot --nginx -d fabrica.persianas.com.br
#
# NÃO edite os server blocks dos outros apps — apenas adicione este arquivo.

server {
    listen 80;
    listen [::]:80;
    server_name fabrica.persianas.com.br;   # ajuste o domínio

    # Tamanho de corpo (uploads/documentos do PCP)
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # permite cookies Secure sob HTTPS
    }
}
