# ============================================================================
# fabrica — SUBPATH /fabrica/ (opção A, recomendada no servidor compartilhado)
# ============================================================================
# Mesmo padrão da Agenda (snippet incluído no vhost existente). NÃO cria server
# block novo nem edita os locations existentes — apenas adiciona os de /fabrica/.
#
# Instalação:
#   sudo cp infra/nginx/fabrica-subpath.conf /etc/nginx/snippets/fabrica-subpath.conf
#   # No vhost compartilhado (server 443), ANTES do fallback "/*" da Logística, adicionar:
#   #     include snippets/fabrica-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Adicionar o `include` é a ÚNICA alteração no arquivo compartilhado — combine
#    com o responsável pela Logística (dono do vhost), conforme as regras de
#    convivência. Não altere nenhum location já existente.
#
# Requer o PCP compilado com o subpath:
#   VITE_BASE=/fabrica/pcp/ VITE_API_PREFIX=/fabrica/api npm run build

# Redireciona sem barra final -> com barra (para os assets relativos resolverem)
location = /fabrica       { return 301 /fabrica/pcp/; }
location = /fabrica/      { return 301 /fabrica/pcp/; }
location = /fabrica/pcp   { return 301 /fabrica/pcp/; }
location = /fabrica/qualidade { return 301 /fabrica/qualidade/; }

# Tudo sob /fabrica/ -> backend Node (o prefixo /fabrica é removido)
location /fabrica/ {
    proxy_pass http://127.0.0.1:3020/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /fabrica;
}
