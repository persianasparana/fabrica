# ============================================================================
# fabrica — HOSTNAME dedicado (opção B)
# ============================================================================
# Server block próprio: o fabrica fica na raiz do hostname (sem subpath), o que
# evita o fallback guloso da Logística e simplifica o build do PCP.
#
# Requer:
#  - um nome que resolva para o servidor (ex.: subdomínio DDNS, ou um nome
#    Tailscale MagicDNS quando o Tailscale entrar — ver ACESSO-TAILSCALE.md);
#  - o certificado TLS cobrindo esse nome (SAN). O cert mkcert atual NÃO cobre
#    nomes novos — alinhar antes de regenerá-lo, OU usar `tailscale cert`.
#
# Instalação (arquivo NOVO, não toca os vhosts existentes):
#   sudo cp infra/nginx/fabrica-host.conf /etc/nginx/sites-available/fabrica
#   sudo ln -s /etc/nginx/sites-available/fabrica /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Com hostname dedicado, o PCP usa o build padrão (base "./", API em /api).

server {
    listen 443 ssl http2;          # Nginx 1.24: sintaxe combinada (não "http2 on;")
    listen [::]:443 ssl http2;
    server_name fabrica.persianasparana.ddns.net;   # ajuste

    ssl_certificate     /etc/nginx/ssl/persianas/persianas.crt;  # precisa cobrir o server_name (SAN)
    ssl_certificate_key /etc/nginx/ssl/persianas/persianas.key;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
