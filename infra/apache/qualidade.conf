# VirtualHost do Sistema de Qualidade
# Ajuste ServerName e os caminhos conforme o servidor.
<VirtualHost *:80>
    ServerName qualidade.persianas.local

    DocumentRoot /var/www/fabrica/qualidade/public

    <Directory /var/www/fabrica/qualidade/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/qualidade_error.log
    CustomLog ${APACHE_LOG_DIR}/qualidade_access.log combined
</VirtualHost>
