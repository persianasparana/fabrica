# VirtualHost do PCP (frontend estático + API PHP na mesma origem)
# Ajuste ServerName e os caminhos conforme o servidor.
<VirtualHost *:80>
    ServerName pcp.persianas.local

    # Frontend (build do Vite)
    DocumentRoot /var/www/fabrica/pcp/frontend/dist

    <Directory /var/www/fabrica/pcp/frontend/dist>
        AllowOverride None
        Require all granted
        # SPA: cai no index.html quando o caminho não é um arquivo
        FallbackResource /index.html
    </Directory>

    # Backend: /api -> pcp/api/public/api (mesma origem -> cookies de sessão)
    Alias /api /var/www/fabrica/pcp/api/public/api
    <Directory /var/www/fabrica/pcp/api/public/api>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/pcp_error.log
    CustomLog ${APACHE_LOG_DIR}/pcp_access.log combined
</VirtualHost>
